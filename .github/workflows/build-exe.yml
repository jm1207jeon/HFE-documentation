# Builds the Windows desktop app (exe) automatically on every push to the dev branch.
# Download: GitHub → Actions 탭 → 최근 실행 클릭 → 하단 Artifacts → "HfeLayoutSim-win64" 클릭.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/cognitive-engineering-documentation-mtpo4w
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run engine tests
        run: dotnet test HfeLayoutSim.sln --configuration Release

      - name: Publish desktop app (self-contained exe)
        run: >
          dotnet publish src/HfeLayoutSim.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: HfeLayoutSim-win64
          path: publish/
          retention-days: 30
